<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Dovedale GeoGuesser</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" />
    <link rel="stylesheet" href="/css/shared.css" />
    <script src="/js/transitions.js"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-[Inter] min-h-screen flex flex-col items-center justify-center px-6 text-center">
    <div class="err-page max-w-md w-full" data-status="404">
      <div class="err-code-row text-7xl font-bold font-mono text-blue-500 mb-4" role="img" aria-label="404">
        <span class="err-digit" style="--i: 0">4</span>
        <span class="err-glass">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="7" />
            <path d="M15.8 15.8 21 21" />
          </svg>
        </span>
        <span class="err-digit" style="--i: 1">4</span>
      </div>
      <h1 class="err-late text-2xl font-bold mb-2" style="--i: 2">Page not found</h1>
      <p class="err-late text-zinc-400 text-sm mb-8" style="--i: 3">You're off the map. This page doesn't exist.</p>
      <div class="err-late flex gap-3 justify-center flex-wrap" style="--i: 4">
        <a href="/" class="m-btn m-btn-filled"><span class="material-symbols-outlined">home</span>Return home</a>
        <a href="/play" class="m-btn m-btn-tonal"><span class="material-symbols-outlined">explore</span>Play solo</a>
      </div>
    </div>
  </body>
</html>
