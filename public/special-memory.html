<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Match | Dovedale GeoGuesser</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" />
    <link rel="stylesheet" href="/css/shared.css" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-[Inter] min-h-screen flex flex-col">
    <nav id="site-nav"></nav>
    <main class="flex-1 w-full max-w-xl mx-auto px-4 sm:px-6 py-8">
      <a href="/specials" class="m-btn m-btn-text m-btn-sm mb-4 -ml-2"><span class="material-symbols-outlined">arrow_back</span>Specials</a>
      <div class="flex items-end justify-between gap-3 mb-4 flex-wrap">
        <div>
          <h1 class="text-3xl font-bold">Memory Match</h1>
          <p class="text-zinc-400 text-sm mt-1">Turn over two cards at a time and find the pairs.</p>
        </div>
        <div class="text-right text-sm">
          <div><span class="text-zinc-500">Turns</span> <span id="memory-turns" class="font-mono font-bold">0</span></div>
          <div id="memory-best" class="text-xs text-zinc-500"></div>
        </div>
      </div>
      <div id="memory-grid" class="memory-grid" aria-label="Cards"></div>
      <p id="memory-status" class="text-center text-lg font-semibold mt-5 min-h-[1.75rem]" aria-live="polite"></p>
      <div class="flex justify-center mt-3">
        <button id="memory-new" class="m-btn m-btn-tonal"><span class="material-symbols-outlined">refresh</span>New game</button>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <script src="/js/sounds.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/special-memory.js"></script>
  </body>
</html>
