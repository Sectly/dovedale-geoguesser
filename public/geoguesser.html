<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GeoGuesser | Dovedale Railway</title>
    <meta name="description" content="5 rounds, 90 seconds each. Identify locations across the Dovedale Railway from screenshots." />
    <meta property="og:title" content="Solo GeoGuesser | Dovedale Railway" />
    <meta property="og:description" content="5 rounds, 90 seconds each. How well do you know the line?" />
    <meta property="og:image" content="/og.png?type=game&v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png?type=game&v=2" />
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&family=Inter:opsz,wght@14..32,200..700"
    />
    <link rel="stylesheet" href="/shared.css?v=2" />
    <style>
      #photo-panel {
        background: #000;
      }
      #round-photo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .score-bar {
        transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #map-canvas,
      #replay-canvas {
        cursor: crosshair;
        display: block;
      }
      .grade-s {
        color: #facc15;
      }
      .grade-a {
        color: #4ade80;
      }
      .grade-b {
        color: #60a5fa;
      }
      .grade-c {
        color: #fb923c;
      }
      .grade-d {
        color: #f87171;
      }
      .round-row:hover {
        background: rgba(255, 255, 255, 0.035);
      }
      #hints-panel {
        max-width: 200px;
      }
      @keyframes timer-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.18);
        }
      }
      .timer-urgent {
        animation: timer-pulse 0.6s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-[Inter] overflow-hidden h-screen w-screen">
    <div id="start-screen" class="absolute inset-0 z-20 flex flex-col screen-fade">
      <div class="flex items-center justify-between px-5 py-4 flex-shrink-0">
        <a href="/" class="flex items-center gap-1.5 text-zinc-500 hover:text-zinc-300 transition text-sm">
          <span class="material-symbols-outlined text-base leading-none">arrow_back</span> Home
        </a>
        <div id="auth-area"></div>
      </div>

      <div class="flex-1 flex flex-col items-center justify-center px-6 pb-10">
        <div class="mb-8 text-center">
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-zinc-800 border border-zinc-700 mb-5">
            <span class="material-symbols-outlined text-5xl text-blue-400" style="font-variation-settings: &quot;FILL&quot; 1">explore</span>
          </div>
          <h1 class="text-5xl font-bold tracking-tight mb-2">GeoGuesser</h1>
          <p class="text-zinc-500 text-base">Dovedale Railway</p>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl px-8 py-7 w-full max-w-sm">
          <div class="flex justify-around mb-7 pb-6 border-b border-zinc-800">
            <div class="text-center">
              <div class="text-2xl font-bold text-zinc-200" id="rounds-preview">5</div>
              <div class="text-xs text-zinc-500 mt-0.5">Rounds</div>
            </div>
            <div class="w-px bg-zinc-800"></div>
            <div class="text-center">
              <div class="text-2xl font-bold text-zinc-200" id="time-preview">90s</div>
              <div class="text-xs text-zinc-500 mt-0.5">Per round</div>
            </div>
            <div class="w-px bg-zinc-800"></div>
            <div class="text-center">
              <div class="text-2xl font-bold text-zinc-200">5k</div>
              <div class="text-xs text-zinc-500 mt-0.5">Max score</div>
            </div>
          </div>

          <div class="mb-5">
            <div class="text-xs text-zinc-500 font-medium mb-2 uppercase tracking-wider">Rounds</div>
            <div class="flex gap-2">
              <button
                class="rounds-pill flex-1 py-2 rounded-xl text-sm font-semibold transition border border-zinc-700 text-zinc-400 hover:border-zinc-500 hover:text-zinc-200"
                data-val="3"
              >
                3
              </button>
              <button
                class="rounds-pill flex-1 py-2 rounded-xl text-sm font-semibold transition border border-blue-500 bg-blue-600/15 text-blue-300 active-pill"
                data-val="5"
              >
                5
              </button>
              <button
                class="rounds-pill flex-1 py-2 rounded-xl text-sm font-semibold transition border border-zinc-700 text-zinc-400 hover:border-zinc-500 hover:text-zinc-200"
                data-val="10"
              >
                10
              </button>
            </div>
            <select id="rounds-select" class="hidden">
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="10">10</option>
            </select>
          </div>

          <div class="mb-6">
            <div class="text-xs text-zinc-500 font-medium mb-2 uppercase tracking-wider">Time per round</div>
            <div class="flex gap-1.5 flex-wrap">
              <button
                class="time-pill flex-1 py-2 rounded-xl text-sm font-semibold transition border border-zinc-700 text-zinc-400 hover:border-zinc-500 hover:text-zinc-200"
                data-val="30"
              >
                30s
              </button>
              <button
                class="time-pill flex-1 py-2 rounded-xl text-sm font-semibold transition border border-zinc-700 text-zinc-400 hover:border-zinc-500 hover:text-zinc-200"
                data-val="60"
              >
                60s
              </button>
              <button
                class="time-pill flex-1 py-2 rounded-xl text-sm font-semibold transition border border-blue-500 bg-blue-600/15 text-blue-300 active-pill"
                data-val="90"
              >
                90s
              </button>
              <button
                class="time-pill flex-1 py-2 rounded-xl text-sm font-semibold transition border border-zinc-700 text-zinc-400 hover:border-zinc-500 hover:text-zinc-200"
                data-val="120"
              >
                120s
              </button>
              <button
                class="time-pill flex-1 py-2 rounded-xl text-sm font-semibold transition border border-zinc-700 text-zinc-400 hover:border-zinc-500 hover:text-zinc-200 flex items-center justify-center"
                data-val="0"
              >
                <span class="material-symbols-outlined text-base leading-none">all_inclusive</span>
              </button>
            </div>
            <select id="time-select" class="hidden">
              <option value="30">30</option>
              <option value="60">60</option>
              <option value="90" selected>90</option>
              <option value="120">120</option>
              <option value="0">0</option>
            </select>
          </div>

          <button
            id="start-btn"
            class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 transition rounded-2xl py-3.5 font-bold text-lg tracking-wide shadow-md"
          >
            Play
          </button>
          <p id="start-error" class="text-red-400 text-sm mt-3 text-center hidden"></p>
        </div>

        <p id="login-save-hint" class="text-zinc-600 text-xs mt-5">
          <a href="/api/auth/login?redirect=/play" class="hover:text-zinc-400 underline transition">Login</a> to save scores
        </p>
      </div>
    </div>

    <div id="round-screen" class="hidden absolute inset-0 flex flex-col md:flex-row">
      <div id="photo-panel" class="flex-shrink-0 md:w-[40%] h-[38%] md:h-full relative overflow-hidden">
        <img id="round-photo" src="" alt="Location screenshot" />

        <div class="absolute top-3 left-3 flex items-center gap-2">
          <a
            href="/"
            class="bg-black/55 backdrop-blur-sm rounded-full w-8 h-8 flex items-center justify-center text-zinc-400 hover:text-zinc-200 hover:bg-black/70 transition"
          >
            <span class="material-symbols-outlined text-base leading-none">home</span>
          </a>
          <div class="bg-black/55 backdrop-blur-sm rounded-full px-3 py-1.5 text-sm font-semibold">
            <span id="round-num">1</span><span class="text-zinc-500"> / </span><span id="round-total">5</span>
          </div>
        </div>

        <div
          id="timer-display"
          class="absolute top-3 right-3 bg-black/70 backdrop-blur-sm rounded-full px-4 py-2 flex items-center gap-2 font-mono font-bold text-xl min-w-[72px] justify-center transition-all duration-300"
        >
          <span class="material-symbols-outlined text-sm leading-none" style="font-variation-settings: &quot;FILL&quot; 1">timer</span>
          <span id="timer-val">90</span>
        </div>

        <div class="absolute bottom-3 left-3 bg-black/55 backdrop-blur-sm rounded-full px-3 py-1.5">
          <div class="text-xs text-zinc-400 leading-none mb-0.5">Score</div>
          <div class="font-mono font-semibold text-sm leading-none" id="running-score">0</div>
        </div>

        <div
          class="absolute bottom-3 right-3 bg-black/55 backdrop-blur-sm rounded-full px-3 py-1.5 text-xs font-mono text-zinc-600"
          id="location-id-badge"
        ></div>
      </div>

      <div id="resize-handle"></div>

      <div class="flex-1 relative bg-zinc-900 overflow-hidden">
        <canvas id="map-canvas" class="absolute inset-0 w-full h-full"></canvas>

        <div class="absolute top-3 right-3 flex flex-col gap-1.5 z-10">
          <select
            id="map-quality"
            title="Map quality"
            class="bg-zinc-800 border border-zinc-700/60 rounded-lg text-xs text-zinc-300 px-1.5 py-1 shadow-sm focus:outline-none"
          >
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <button
            id="zoom-in"
            class="bg-zinc-800 w-10 h-10 rounded-full flex items-center justify-center hover:bg-zinc-700 transition shadow-sm border border-zinc-700/60"
          >
            <span class="material-symbols-outlined text-lg">add</span>
          </button>
          <button
            id="zoom-out"
            class="bg-zinc-800 w-10 h-10 rounded-full flex items-center justify-center hover:bg-zinc-700 transition shadow-sm border border-zinc-700/60"
          >
            <span class="material-symbols-outlined text-lg">remove</span>
          </button>
        </div>

        <div class="absolute top-3 left-3 z-10 flex flex-col gap-1.5" id="hints-panel"></div>

        <div
          class="absolute bottom-0 inset-x-0 z-10 flex items-center justify-between gap-3 px-4 pb-3 pt-8 bg-gradient-to-t from-zinc-950/70 to-transparent pointer-events-none"
        >
          <p id="click-hint" class="text-zinc-400 text-sm pointer-events-auto select-none">Click the map to place your pin</p>
          <button
            id="guess-btn"
            class="pointer-events-auto bg-zinc-700 text-zinc-500 pl-4 pr-5 py-2.5 rounded-full font-semibold text-sm whitespace-nowrap cursor-not-allowed transition flex items-center gap-2"
            disabled
          >
            <span class="material-symbols-outlined text-base leading-none">place</span> Submit Guess
          </button>
        </div>

        <div id="result-screen" class="absolute inset-x-0 bottom-0 z-20">
          <div class="bg-zinc-800 rounded-t-3xl shadow-xl px-5 pt-3 pb-5">
            <div class="flex justify-center mb-4">
              <div class="w-8 h-1 rounded-full bg-zinc-600"></div>
            </div>
            <div class="flex items-center justify-between mb-3">
              <div>
                <div class="text-3xl font-bold leading-none" id="result-score-display">0</div>
                <div class="text-zinc-400 text-xs mt-1" id="result-distance-display"></div>
              </div>
              <div class="text-right">
                <div class="text-zinc-300 text-sm" id="result-location-label"></div>
                <div class="text-zinc-500 text-xs font-mono mt-0.5" id="result-location-id"></div>
              </div>
            </div>
            <div class="w-full bg-zinc-700 rounded-full h-2 mb-4 overflow-hidden">
              <div class="score-bar h-2 rounded-full bg-blue-500" id="result-score-bar" style="width: 0%"></div>
            </div>
            <div class="flex items-center gap-3">
              <button id="next-btn" class="flex-1 bg-blue-600 hover:bg-blue-500 active:scale-95 transition py-2.5 rounded-full font-semibold text-sm shadow-sm">
                Next Round
              </button>
              <a
                id="result-report-link"
                href="#"
                class="w-10 h-10 rounded-full flex items-center justify-center text-zinc-500 hover:text-zinc-300 hover:bg-zinc-700 transition"
              >
                <span class="material-symbols-outlined text-base leading-none">flag</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="summary-screen" class="hidden absolute inset-0 overflow-y-auto z-20 bg-zinc-950 screen-fade">
      <div class="max-w-md mx-auto px-5 py-10">
        <div class="text-center mb-8">
          <div class="text-xs text-zinc-500 uppercase tracking-widest mb-2 font-medium">Game Over</div>
          <div class="text-7xl font-bold mb-1 font-mono" id="summary-total">0</div>
          <div class="text-zinc-500 text-sm" id="summary-out-of"></div>
          <div id="summary-streak" class="flex justify-center mt-4"></div>
        </div>

        <div id="summary-save-area" class="text-center mb-6"></div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden mb-6">
          <div class="px-5 py-3 border-b border-zinc-800">
            <span class="text-xs text-zinc-500 uppercase tracking-wider font-medium">Round Breakdown</span>
          </div>
          <div id="summary-rounds" class="divide-y divide-zinc-800/60 px-5"></div>
        </div>

        <div class="flex gap-3">
          <button
            id="replay-btn"
            class="flex-1 bg-zinc-800 hover:bg-zinc-700 transition py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 border border-zinc-700"
          >
            <span class="material-symbols-outlined text-base leading-none">map</span> View Map
          </button>
          <button id="play-again-btn" class="flex-1 bg-blue-600 hover:bg-blue-500 transition py-3 rounded-xl font-bold text-sm shadow-sm">Play Again</button>
        </div>

        <div class="flex justify-center gap-4 mt-5">
          <a href="/leaderboard" class="text-zinc-600 hover:text-zinc-400 transition text-xs">Leaderboard</a>
          <a href="/duels" class="text-zinc-600 hover:text-zinc-400 transition text-xs">Duels</a>
          <a href="/" class="text-zinc-600 hover:text-zinc-400 transition text-xs">Home</a>
        </div>
      </div>
    </div>

    <div id="replay-screen" class="hidden absolute inset-0 z-30 bg-zinc-950 flex flex-col screen-fade">
      <div class="flex items-center gap-3 px-4 py-3 border-b border-zinc-800 flex-shrink-0 bg-zinc-900">
        <button id="replay-back-btn" class="flex items-center gap-1.5 text-zinc-400 hover:text-zinc-100 transition text-sm">
          <span class="material-symbols-outlined text-base leading-none">arrow_back</span> Back
        </button>
        <span class="text-zinc-600 text-xs ml-auto" id="replay-legend">green = correct · red = your guess</span>
      </div>
      <div class="flex-1 relative">
        <canvas id="replay-canvas" class="absolute inset-0 w-full h-full"></canvas>
      </div>
    </div>

    <script src="/guard.js?v=1"></script>
    <script src="/fp.js"></script>
    <script src="/map-upstream.js"></script>
    <script src="/map-canvas.js?v=3"></script>
    <script>
      document.querySelectorAll(".rounds-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".rounds-pill").forEach((b) => {
            b.classList.remove("border-blue-500", "bg-blue-600/15", "text-blue-300", "active-pill");
            b.classList.add("border-zinc-700", "text-zinc-400");
          });
          btn.classList.add("border-blue-500", "bg-blue-600/15", "text-blue-300", "active-pill");
          btn.classList.remove("border-zinc-700", "text-zinc-400");
          const val = btn.dataset.val;
          document.getElementById("rounds-select").value = val;
          document.getElementById("rounds-preview").textContent = val;
        });
      });

      document.querySelectorAll(".time-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".time-pill").forEach((b) => {
            b.classList.remove("border-blue-500", "bg-blue-600/15", "text-blue-300", "active-pill");
            b.classList.add("border-zinc-700", "text-zinc-400");
          });
          btn.classList.add("border-blue-500", "bg-blue-600/15", "text-blue-300", "active-pill");
          btn.classList.remove("border-zinc-700", "text-zinc-400");
          const val = btn.dataset.val;
          document.getElementById("time-select").value = val;
          document.getElementById("time-preview").innerHTML =
            val === "0" ? '<span class="material-symbols-outlined text-2xl leading-none">all_inclusive</span>' : val + "s";
        });
      });

      (function () {
        const handle = document.getElementById("resize-handle");
        const photoPanel = document.getElementById("photo-panel");
        const roundScreen = document.getElementById("round-screen");
        let dragging = false;

        function isDesktop() {
          return window.innerWidth >= 768;
        }

        function startDrag(e) {
          dragging = true;
          handle.classList.add("dragging");
          document.body.style.cursor = isDesktop() ? "col-resize" : "row-resize";
          document.body.style.userSelect = "none";
          e.preventDefault();
        }

        function onMove(clientX, clientY) {
          if (!dragging) return;
          const rect = roundScreen.getBoundingClientRect();
          if (isDesktop()) {
            const pct = Math.min(70, Math.max(20, ((clientX - rect.left) / rect.width) * 100));
            photoPanel.style.width = pct + "%";
          } else {
            const pct = Math.min(65, Math.max(18, ((clientY - rect.top) / rect.height) * 100));
            photoPanel.style.height = pct + "%";
          }
          window.dispatchEvent(new Event("resize"));
        }

        function endDrag() {
          dragging = false;
          handle.classList.remove("dragging");
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
        }

        handle.addEventListener("mousedown", startDrag);
        document.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
        document.addEventListener("mouseup", endDrag);

        handle.addEventListener("touchstart", startDrag, { passive: false });
        document.addEventListener(
          "touchmove",
          (e) => {
            if (!dragging) return;
            e.preventDefault();
            onMove(e.touches[0].clientX, e.touches[0].clientY);
          },
          { passive: false }
        );
        document.addEventListener("touchend", endDrag);
      })();
    </script>
    <script src="/shared.js"></script>
    <script src="/geoguesser.js?v=6"></script>
  </body>
</html>
