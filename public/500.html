<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something went wrong | Dovedale GeoGuesser</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" />
    <link rel="stylesheet" href="/css/shared.css" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-[Inter] min-h-screen flex flex-col items-center justify-center px-6 text-center">
    <div class="max-w-md w-full">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-zinc-900 mb-6">
        <span class="material-symbols-outlined text-5xl text-zinc-500" style="font-variation-settings: &quot;FILL&quot; 1">error</span>
      </div>
      <div class="text-7xl font-bold font-mono text-blue-500 mb-3" id="err-code">500</div>
      <h1 class="text-2xl font-bold mb-2" id="err-title">Something went wrong</h1>
      <p class="text-zinc-400 text-sm mb-2" id="err-message">That one is on us, not you. Try again in a moment.</p>
      <p class="text-zinc-600 text-xs mb-8" id="err-help">
        If it keeps happening, tell us in a <a href="/settings?ticket=other#support" class="underline hover:text-zinc-400">support ticket</a
        ><span id="err-ref"></span>.
      </p>
      <div class="flex gap-3 justify-center flex-wrap">
        <button onclick="location.reload()" class="m-btn m-btn-filled"><span class="material-symbols-outlined">refresh</span>Try again</button>
        <a href="/" class="m-btn m-btn-tonal"><span class="material-symbols-outlined">home</span>Return home</a>
      </div>
    </div>
  </body>
</html>
