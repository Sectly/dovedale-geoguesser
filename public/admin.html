<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Staff Panel | Dovedale GeoGuesser</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" />
    <link rel="stylesheet" href="/css/shared.css" />
    <script src="/js/transitions.js"></script>
    <style>
      #map-canvas {
        cursor: crosshair;
        display: block;
      }
      .submission-img {
        max-height: 180px;
        object-fit: contain;
        width: 100%;
        background: #000;
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-[Inter] h-screen overflow-hidden flex flex-col">
    <nav id="site-nav">
      <button id="sidebar-toggle" data-keep class="md:hidden text-zinc-400 hover:text-zinc-100 transition flex items-center">
        <span class="material-symbols-outlined text-xl leading-none">menu</span>
      </button>
    </nav>
    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-40 md:hidden"></div>

    <div id="access-denied" class="flex-1 flex items-center justify-center">
      <div class="text-center">
        <span class="material-symbols-outlined text-5xl text-zinc-600 block mb-3" style="font-variation-settings: &quot;FILL&quot; 1">lock</span>
        <p class="text-zinc-400" id="access-msg">Loading...</p>
      </div>
    </div>

    <div id="admin-panel" class="hidden flex-1 flex overflow-hidden">
      <div
        id="admin-sidebar"
        class="w-52 flex-shrink-0 bg-zinc-900 border-r border-zinc-800 flex-col py-4 gap-1 px-2 hidden md:flex fixed md:static inset-y-0 left-0 z-50 overflow-y-auto"
      >
        <button
          data-tab="overview"
          data-label="Overview"
          data-icon="dashboard"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition bg-zinc-700 text-white"
        >
          <span class="material-symbols-outlined text-lg leading-none">dashboard</span>Overview
        </button>
        <button
          data-tab="chat"
          data-label="Staff Chat"
          data-icon="forum"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white hidden"
        >
          <span class="material-symbols-outlined text-lg leading-none">forum</span>Staff Chat
        </button>
        <div class="px-3 pt-3 pb-1 text-[11px] font-semibold uppercase tracking-wider text-zinc-600">Review</div>
        <button
          data-tab="submissions"
          data-label="Submissions"
          data-icon="add_photo_alternate"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white"
        >
          <span class="material-symbols-outlined text-lg leading-none">add_photo_alternate</span>Submissions
        </button>
        <button
          data-tab="suggestions"
          data-label="Suggestions"
          data-icon="lightbulb"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white"
        >
          <span class="material-symbols-outlined text-lg leading-none">lightbulb</span>Suggestions
        </button>
        <button
          data-tab="locations"
          data-label="Locations"
          data-icon="location_on"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white"
        >
          <span class="material-symbols-outlined text-lg leading-none">location_on</span>Locations
        </button>
        <a
          href="/submit"
          class="flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white"
          title="Opens the Submit page. Locations added there go through the normal review queue."
        >
          <span class="material-symbols-outlined text-lg leading-none">add_location_alt</span>Submit a Location
          <span class="material-symbols-outlined text-sm leading-none opacity-50 ml-auto">open_in_new</span>
        </a>
        <div class="px-3 pt-3 pb-1 text-[11px] font-semibold uppercase tracking-wider text-zinc-600 moderator-up">Community</div>
        <button
          data-tab="users"
          data-label="Users"
          data-icon="group"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white"
        >
          <span class="material-symbols-outlined text-lg leading-none">group</span>Users
        </button>
        <button
          data-tab="tickets"
          data-label="Tickets"
          data-icon="support_agent"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white"
        >
          <span class="material-symbols-outlined text-lg leading-none">support_agent</span>Tickets
        </button>
        <button
          data-tab="duels"
          data-label="Duels"
          data-icon="swords"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white"
        >
          <span class="material-symbols-outlined text-lg leading-none">swords</span>Duels
        </button>
        <button
          data-tab="tournaments"
          data-label="Tournaments"
          data-icon="trophy"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white"
        >
          <span class="material-symbols-outlined text-lg leading-none">trophy</span>Tournaments
        </button>
        <button
          data-tab="announcements"
          data-label="Announcements"
          data-icon="campaign"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white"
        >
          <span class="material-symbols-outlined text-lg leading-none">campaign</span>Announcements
        </button>
        <button
          data-tab="staff"
          data-label="Staff"
          data-icon="shield_person"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white"
        >
          <span class="material-symbols-outlined text-lg leading-none">shield_person</span>Staff
        </button>
        <div class="px-3 pt-3 pb-1 text-[11px] font-semibold uppercase tracking-wider text-zinc-600 senior-only hidden">Insight</div>
        <button
          data-tab="stats"
          data-label="Stats"
          data-icon="monitoring"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white senior-only hidden"
        >
          <span class="material-symbols-outlined text-lg leading-none">monitoring</span>Stats
        </button>
        <button
          data-tab="audit"
          data-label="Audit Log"
          data-icon="history"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white senior-only hidden"
        >
          <span class="material-symbols-outlined text-lg leading-none">history</span>Audit Log
        </button>
        <button
          data-tab="email"
          data-label="Email"
          data-icon="mail"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white hidden"
        >
          <span class="material-symbols-outlined text-lg leading-none">mail</span>Email
        </button>
        <button
          data-tab="system"
          data-label="System"
          data-icon="dns"
          class="tab-btn flex items-center gap-2.5 text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white operator-only hidden"
        >
          <span class="material-symbols-outlined text-lg leading-none">dns</span>System
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 md:p-6" id="tab-content">
        <div class="skeleton h-24 rounded-2xl mb-2"></div>
        <div class="skeleton h-24 rounded-2xl mb-2"></div>
        <div class="skeleton h-24 rounded-2xl"></div>
      </div>
    </div>

    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-[70] modal-fade">
      <div class="bg-zinc-900 rounded-2xl p-6 w-full max-w-sm mx-4">
        <h3 class="font-bold mb-2" id="confirm-title">Confirm</h3>
        <p class="text-zinc-400 text-sm mb-5" id="confirm-message"></p>
        <div class="flex gap-3 justify-end">
          <button id="confirm-cancel" class="m-btn m-btn-tonal">Cancel</button>
          <button id="confirm-ok" class="m-btn m-btn-danger">Confirm</button>
        </div>
      </div>
    </div>

    <div id="input-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-[70] modal-fade">
      <div class="bg-zinc-900 rounded-2xl p-6 w-full max-w-sm mx-4">
        <h3 class="font-bold mb-1" id="input-title">Enter value</h3>
        <p class="text-zinc-500 text-xs mb-3" id="input-note"></p>
        <input
          id="input-field"
          type="text"
          class="w-full bg-zinc-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-zinc-600 mb-4"
        />
        <div class="flex gap-3 justify-end">
          <button id="input-cancel" class="m-btn m-btn-tonal">Cancel</button>
          <button id="input-ok" class="m-btn m-btn-filled">OK</button>
        </div>
      </div>
    </div>

    <div id="reason-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-[60] px-4 modal-fade">
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-md" role="dialog" aria-modal="true" aria-labelledby="reason-title">
        <h3 class="font-bold mb-1" id="reason-title">Reason</h3>
        <p class="text-zinc-500 text-xs mb-3" id="reason-note"></p>
        <div id="reason-duration" class="mb-3">
          <label class="text-xs text-zinc-400 block mb-1" for="reason-hours">Duration (hours)</label>
          <div class="flex gap-2 items-center flex-wrap">
            <input
              id="reason-hours"
              type="number"
              min="1"
              step="1"
              class="w-24 bg-zinc-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <div id="reason-presets" class="flex gap-1.5 flex-wrap"></div>
          </div>
        </div>
        <div id="reason-rules-wrap">
          <div class="text-xs text-zinc-400 mb-1.5">Rules broken <span class="text-zinc-600">(click to cite)</span></div>
          <div id="reason-rules" class="mb-2"></div>
        </div>
        <label class="text-xs text-zinc-400 block mb-1" for="reason-text">Reason <span class="text-red-400/80">(required, shown to the user)</span></label>
        <textarea
          id="reason-text"
          rows="3"
          maxlength="500"
          placeholder="What happened, and why this action?"
          class="w-full bg-zinc-800 rounded-xl px-4 py-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-zinc-600"
        ></textarea>
        <p class="text-xs text-zinc-500 h-4 mt-1 mb-3" id="reason-count"></p>
        <div class="flex gap-3 justify-end">
          <button id="reason-cancel" class="m-btn m-btn-tonal">Cancel</button>
          <button id="reason-ok" class="m-btn m-btn-filled">Confirm</button>
        </div>
      </div>
    </div>

    <div id="user-panel" class="hidden fixed inset-0 bg-black/60 z-50 flex justify-end modal-fade" data-on-click="closeUserPanelFromBackdrop(event)">
      <div
        class="bg-zinc-900 border-l border-zinc-800 w-full max-w-xl h-full flex flex-col panel-slide"
        role="dialog"
        aria-modal="true"
        aria-labelledby="user-panel-title"
      >
        <div class="flex items-center gap-3 px-5 py-4 border-b border-zinc-800 flex-shrink-0">
          <span class="material-symbols-outlined text-xl text-blue-400">gavel</span>
          <h3 class="font-bold flex-1 truncate" id="user-panel-title">User</h3>
          <button
            data-on-click="closeUserPanel()"
            aria-label="Close"
            class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 transition"
          >
            <span class="material-symbols-outlined text-xl leading-none">close</span>
          </button>
        </div>
        <div id="user-panel-body" class="flex-1 overflow-y-auto custom-scroll px-5 py-4"></div>
      </div>
    </div>

    <div id="deny-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-[70] modal-fade">
      <div class="bg-zinc-900 rounded-2xl p-6 w-full max-w-md mx-4">
        <h3 class="font-bold mb-3" id="deny-modal-title">Deny</h3>
        <div class="text-xs text-zinc-400 mb-1.5">Guidelines broken <span class="text-zinc-600">(click to cite)</span></div>
        <div id="deny-rules" class="mb-2"></div>
        <textarea
          id="deny-reason"
          rows="3"
          placeholder="Reason, shown to the user (required)"
          maxlength="500"
          required
          class="w-full bg-zinc-800 rounded-xl px-4 py-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-red-500 placeholder:text-zinc-600 mb-1"
        ></textarea>
        <p id="deny-count" class="text-xs text-zinc-500 mb-3 min-h-[1rem]"></p>
        <div class="flex gap-3 justify-end">
          <button id="deny-cancel" class="m-btn m-btn-tonal">Cancel</button>
          <button id="deny-confirm" class="m-btn m-btn-danger" disabled>Deny</button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/admin/main.js"></script>
  </body>
</html>
