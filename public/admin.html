<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Staff Panel | Dovedale GeoGuesser</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&family=Inter:opsz,wght@14..32,200..700"
    />
    <link rel="stylesheet" href="/shared.css?v=2" />
    <style>
      #map-canvas {
        cursor: crosshair;
        display: block;
      }
      .submission-img {
        max-height: 180px;
        object-fit: contain;
        width: 100%;
        background: #000;
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-[Inter] h-screen overflow-hidden flex flex-col">
    <nav class="flex-shrink-0 bg-zinc-900 border-b border-zinc-800 flex items-center gap-4 px-4 py-2 z-30">
      <a href="/" class="text-zinc-400 hover:text-zinc-100 transition flex items-center gap-1 text-sm">
        <span class="material-symbols-outlined text-base leading-none">home</span> Home
      </a>
      <span class="text-zinc-700">/</span>
      <span class="text-zinc-100 font-semibold text-sm">Staff Panel</span>
      <div class="ml-auto flex items-center gap-3" id="auth-area"></div>
    </nav>

    <div id="access-denied" class="flex-1 flex items-center justify-center">
      <div class="text-center">
        <span class="material-symbols-outlined text-5xl text-zinc-600 block mb-3" style="font-variation-settings: &quot;FILL&quot; 1">lock</span>
        <p class="text-zinc-400" id="access-msg">Loading...</p>
      </div>
    </div>

    <div id="admin-panel" class="hidden flex-1 flex overflow-hidden">
      <div class="w-52 flex-shrink-0 bg-zinc-900 border-r border-zinc-800 flex flex-col py-4 gap-1 px-2">
        <button data-tab="submissions" class="tab-btn text-left px-3 py-2 rounded-lg text-sm font-medium transition bg-zinc-700 text-white">Submissions</button>
        <button data-tab="suggestions" class="tab-btn text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white">
          Suggestions
        </button>
        <button data-tab="locations" class="tab-btn text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white">
          Locations
        </button>
        <button
          data-tab="upload"
          class="tab-btn text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white operator-only hidden flex items-center gap-1.5"
        >
          Upload Location <span class="material-symbols-outlined text-sm leading-none opacity-50">open_in_new</span>
        </button>
        <button data-tab="users" class="tab-btn text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white">Users</button>
        <button data-tab="support" class="tab-btn text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white">Support</button>
        <button
          data-tab="staff"
          class="tab-btn text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white senior-only hidden"
        >
          Staff
        </button>
        <button
          data-tab="stats"
          class="tab-btn text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white senior-only hidden"
        >
          Stats
        </button>
        <button
          data-tab="audit"
          class="tab-btn text-left px-3 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white senior-only hidden"
        >
          Audit Log
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6" id="tab-content">
        <div class="text-zinc-500">Loading...</div>
      </div>

      <div id="upload-map-panel" class="hidden absolute inset-0 flex" style="top: 41px">
        <div class="w-80 flex-shrink-0 bg-zinc-900 border-r border-zinc-800 flex flex-col p-4 gap-4 overflow-y-auto">
          <div class="flex items-center gap-2">
            <button id="upload-map-back" class="text-zinc-400 hover:text-zinc-100 transition">
              <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h3 class="font-bold">Upload Location</h3>
          </div>
          <label
            class="border-2 border-dashed border-zinc-700 rounded-xl flex flex-col items-center justify-center py-6 cursor-pointer hover:border-zinc-500 transition gap-2"
          >
            <span class="material-symbols-outlined text-3xl text-zinc-500">upload</span>
            <span class="text-zinc-500 text-sm" id="upload-filename">Click to upload image</span>
            <input id="upload-file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden" />
          </label>
          <div id="upload-preview-wrap" class="hidden bg-black rounded-xl overflow-hidden">
            <img id="upload-preview" src="" alt="" class="submission-img" />
          </div>
          <input
            id="upload-label"
            type="text"
            placeholder="Label (optional)"
            maxlength="100"
            class="bg-zinc-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-zinc-600"
          />
          <div>
            <div class="text-xs text-zinc-500 mb-1.5">Hints <span class="text-zinc-700">(optional, up to 3)</span></div>
            <div class="flex flex-col gap-2">
              <input
                id="upload-hint-1"
                type="text"
                placeholder="Hint 1"
                maxlength="200"
                class="bg-zinc-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-600 placeholder:text-zinc-600"
              />
              <input
                id="upload-hint-2"
                type="text"
                placeholder="Hint 2"
                maxlength="200"
                class="bg-zinc-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-600 placeholder:text-zinc-600"
              />
              <input
                id="upload-hint-3"
                type="text"
                placeholder="Hint 3"
                maxlength="200"
                class="bg-zinc-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-600 placeholder:text-zinc-600"
              />
            </div>
          </div>
          <div id="upload-pin-status" class="text-zinc-600 text-sm">Click map to mark location</div>
          <button id="upload-submit-btn" class="bg-blue-600 hover:bg-blue-500 disabled:bg-zinc-600 transition px-4 py-2.5 rounded-xl font-semibold" disabled>
            Add Location
          </button>
          <p id="upload-error" class="text-red-400 text-sm hidden"></p>
          <p id="upload-success" class="text-green-400 text-sm hidden">Location added!</p>
        </div>
        <div class="flex-1 relative">
          <canvas id="map-canvas"></canvas>
          <div class="absolute top-3 right-3 flex flex-col gap-2 z-10">
            <select
              id="map-quality"
              title="Map quality"
              class="bg-zinc-800/90 border border-zinc-700/60 rounded-lg text-xs text-zinc-300 px-1.5 py-1 focus:outline-none"
            >
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
            <button id="zoom-in" class="bg-zinc-800/90 w-9 h-9 rounded-full flex items-center justify-center hover:bg-zinc-700 transition">
              <span class="material-symbols-outlined text-lg">add</span>
            </button>
            <button id="zoom-out" class="bg-zinc-800/90 w-9 h-9 rounded-full flex items-center justify-center hover:bg-zinc-700 transition">
              <span class="material-symbols-outlined text-lg">remove</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
      <div class="bg-zinc-900 rounded-2xl p-6 w-full max-w-sm mx-4">
        <h3 class="font-bold mb-2" id="confirm-title">Confirm</h3>
        <p class="text-zinc-400 text-sm mb-5" id="confirm-message"></p>
        <div class="flex gap-3 justify-end">
          <button id="confirm-cancel" class="px-5 py-2 rounded-xl bg-zinc-700 hover:bg-zinc-600 transition text-sm">Cancel</button>
          <button id="confirm-ok" class="px-5 py-2 rounded-xl transition text-sm font-semibold">Confirm</button>
        </div>
      </div>
    </div>

    <div id="input-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
      <div class="bg-zinc-900 rounded-2xl p-6 w-full max-w-sm mx-4">
        <h3 class="font-bold mb-1" id="input-title">Enter value</h3>
        <p class="text-zinc-500 text-xs mb-3" id="input-note"></p>
        <input
          id="input-field"
          type="text"
          class="w-full bg-zinc-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-zinc-600 mb-4"
        />
        <div class="flex gap-3 justify-end">
          <button id="input-cancel" class="px-5 py-2 rounded-xl bg-zinc-700 hover:bg-zinc-600 transition text-sm">Cancel</button>
          <button id="input-ok" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 transition text-sm font-semibold">OK</button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-2 z-[100] pointer-events-none"></div>

    <div id="deny-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
      <div class="bg-zinc-900 rounded-2xl p-6 w-full max-w-md mx-4">
        <h3 class="font-bold mb-3">Deny Submission</h3>
        <textarea
          id="deny-reason"
          rows="3"
          placeholder="Reason (optional)"
          class="w-full bg-zinc-800 rounded-xl px-4 py-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-red-500 placeholder:text-zinc-600 mb-4"
        ></textarea>
        <div class="flex gap-3 justify-end">
          <button id="deny-cancel" class="px-5 py-2 rounded-xl bg-zinc-700 hover:bg-zinc-600 transition text-sm">Cancel</button>
          <button id="deny-confirm" class="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-500 transition text-sm font-semibold">Deny</button>
        </div>
      </div>
    </div>

    <script src="/fp.js"></script>
    <script src="/map-upstream.js"></script>
    <script src="/map-canvas.js?v=3"></script>
    <script src="/shared.js"></script>
    <script src="/admin.js?v=3"></script>
  </body>
</html>
