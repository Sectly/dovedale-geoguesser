<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News | Dovedale GeoGuesser</title>
    <meta name="description" content="Announcements and what changed in each update of Dovedale GeoGuesser." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" />
    <link rel="stylesheet" href="/css/shared.css" />
    <script src="/js/transitions.js"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-[Inter] min-h-screen flex flex-col">
    <nav id="site-nav"></nav>
    <main class="flex-1 w-full max-w-2xl mx-auto px-4 sm:px-6 py-10">
      <div class="flex items-center gap-3 mb-2">
        <span class="material-symbols-outlined text-3xl text-[var(--md-primary-bright)]" style="font-variation-settings: &quot;FILL&quot; 1">newspaper</span>
        <h1 class="text-3xl font-bold">News</h1>
      </div>
      <p class="text-zinc-400 text-sm mb-6">Announcements, and what changed in each update.</p>
      <div class="flex gap-1.5 mb-5" id="news-filters">
        <button class="m-chip" data-kind="" aria-pressed="true">Everything</button>
        <button class="m-chip" data-kind="update" aria-pressed="false">Updates</button>
        <button class="m-chip" data-kind="announcement" aria-pressed="false">Announcements</button>
      </div>
      <div id="news-list" class="flex flex-col gap-3">
        <div class="skeleton h-24 rounded-2xl"></div>
        <div class="skeleton h-24 rounded-2xl"></div>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <script src="/js/sounds.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/tooltips.js"></script>
    <script src="/js/news.js"></script>
  </body>
</html>
